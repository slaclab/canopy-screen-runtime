# This workflow will publish a new version of the documentation to GitHub Pages

name: Build & Deploy Documentation
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "zensical.toml"
      - "mkdocs.yml"
      - "docs/**"
  workflow_dispatch:

jobs:
  docs:
    uses: slaclab/swapps-ci-helpers/.github/workflows/docs.yml@afaac9fd67e0b31c887a48c19d9a6b219ea72a8f
    permissions:
      contents: read
      pages: write
      id-token: write
