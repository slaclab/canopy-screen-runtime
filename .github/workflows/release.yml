name: Release

# Publishes every workspace package to GitHub Packages when a version tag is
# pushed. Flow: bump versions (lockstep) on main → tag v<version> → push tag.
# Dependencies, the @slaclab SDK included, install from the public npm
# registry; each package's publishConfig.registry sends the publish to GitHub
# Packages. Auth is the workflow's own GITHUB_TOKEN — no secrets to manage.
# After the FIRST publish, grant each consumer repo read access on every package
# (package page → Package settings → Manage Actions access), or their CI
# cannot install these packages.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish
        # Token for npm.pkg.github.com only; the @slaclab scope itself stays on
        # the public registry. The single quotes keep ${NODE_AUTH_TOKEN} literal
        # for pnpm to expand, so the token never lands in the file.
        run: |
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> "$HOME/.npmrc"
          pnpm -r publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
