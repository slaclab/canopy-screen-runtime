name: Test

# `pnpm install` pulls the @slaclab SDK packages (canopy-client/react/shell)
# from GitHub Packages; the install step authenticates with GITHUB_TOKEN via
# NODE_AUTH_TOKEN (see .npmrc), and the job is granted packages: read.
#
# NOTE: slaclab/swapps-ci-helpers's js-test.yml does not currently set
# NODE_AUTH_TOKEN before running `pnpm install`, so this will likely fail to
# install the @slaclab packages until that's addressed upstream. See the PR
# description for details.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    uses: slaclab/swapps-ci-helpers/.github/workflows/js-test.yml@afaac9fd67e0b31c887a48c19d9a6b219ea72a8f
    permissions:
      contents: read
      packages: read
    with:
      node-version: "23.11.0"
      test-command: "pnpm test"
